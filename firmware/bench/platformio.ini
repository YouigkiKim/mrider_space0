; MRider bench bring-up sketches
;
; One PlatformIO project, one environment per step of the five-step bench
; order in docs/build/03-electrical.md 3.5.3. Each environment builds exactly
; one source file, so there is no shared state between them and no sketch can
; mask another's fault.
;
;   pio run -e i2c_scan     -t upload -t monitor
;   pio run -e as5600_check -t upload -t monitor
;   pio run -e quad_count   -t upload -t monitor
;
; Added for Stages 0-3 of docs/build/04-firmware.md (same one-file-per-env rule):
;   pio run -e ibus_monitor      -t upload -t monitor   ; Stage 2 Layer A: i-BUS frames, map, RC loss
;   pio run -e pwm_effort_check  -t upload -t monitor   ; Stage 1: steer/drive effort, sine, frame rate, hang
;   pio run -e imu_check         -t upload -t monitor   ; IMU on Wire1 (17/16): scan, product ID, angles
;
; Steps 1 and 2 of that order need NO firmware. They are a meter on a rail and
; a meter on a latch output, and they come first precisely so that a fault
; found there can never be blamed on code.

[env]
; PINNED. An unpinned platform means the same project commit builds differently
; next semester, and "it worked in October" stops being a statement anybody can
; act on. 6.0.0 is the registry's current release at the time of pinning, not a
; version these sketches have been proven on - nothing here had ever been
; compiled. The first green CI run is the proof, and it is reproducible from
; then on. Raising this is a deliberate, reviewable commit.
platform      = teensy@6.0.0
board         = teensy41
framework     = arduino
monitor_speed = 115200
; The Teensy's USB serial port on Linux / WSL. Without it `pio device monitor` asks for a port
; index whenever it starts before the Teensy has re-attached after an upload. The pattern also
; catches /dev/ttyACM1 if the old node is still held. Elsewhere: pio device monitor -p <port>.
monitor_port  = /dev/ttyACM*
; Command-line loader: the default (teensy-gui) needs PJRC's GUI app, which a WSL / headless
; laptop does not have. Same as firmware/mitt_dbw. Needs PJRC's 00-teensy.rules udev file.
upload_protocol = teensy-cli
build_flags   = -Wall -Wextra

[env:i2c_scan]
build_src_filter = +<i2c_scan.cpp>

[env:as5600_check]
build_src_filter = +<as5600_check.cpp>

[env:quad_count]
build_src_filter = +<quad_count.cpp>

[env:ibus_monitor]
build_src_filter = +<ibus_monitor.cpp>

[env:imu_check]
build_src_filter = +<imu_check.cpp>

[env:pwm_effort_check]
build_src_filter = +<pwm_effort_check.cpp>
lib_deps = https://github.com/tonton81/WDT_T4.git#1910b57d24468cd3419959118a2e1e6192f5e7fa
