; MRider Teensy 4.1 drive-by-wire firmware  (docs/design/dbw.md §9-§12)
; THIS BUILD: Stage 0, sensing only (docs/build/04-firmware.md §4.3). Features are added one
; stage at a time.
;
;   pio run -e uros_echo -t upload   ; toolchain + agent + mitt_msgs smoke test (no pins)
;   pio run -e mitt_dbw  -t upload   ; Stage 0 firmware: steering angle + drive encoder -> ROS 2
;
; micro-ROS comes from lib/micro_ros_arduino (git-ignored build artifact):
; micro_ros_arduino v2.0.8-humble (dbw.md §9 pin) rebuilt with mitt_msgs by
;   ./scripts/build_microros_lib.sh          (docker, ~5 min; re-run when mitt_msgs changes)
;
; Host unit tests (no Teensy needed):
;   ./test/host/run_host_tests.sh

[platformio]
default_envs = mitt_dbw

[env]
; PINNED, same platform as firmware/bench. Raising it is a deliberate, reviewable commit.
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli        ; needs PJRC's 00-teensy.rules udev file on Linux
monitor_speed = 115200

; (micro_ros_arduino.h includes NativeEthernet.h on Teensy 4.1, so NativeEthernet/FNET get
; compiled too. Unused transports are not linked; do not lib_ignore them, the header needs them.)
lib_deps =
    https://github.com/tonton81/WDT_T4.git#1910b57d24468cd3419959118a2e1e6192f5e7fa
; QuadEncoder, Wire and EEPROM ship with the Teensy framework (bench/quad_count uses the same).

build_flags = -Wall -Wextra
    -L lib/micro_ros_arduino/src/imxrt1062/fpv5-d16-hard -l microros

[env:mitt_dbw]
build_src_filter = +<*> -<uros_echo.cpp>

[env:uros_echo]
build_src_filter = +<uros_echo.cpp>
