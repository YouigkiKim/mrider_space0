<rect width="1200" height="860" fill="#ffffff"/>
<text class="h1" x="30" y="38" text-anchor="start">FS-iA6B 수신기 — 핀 구조와 벤치 연결 (firmware/steering)</text>
<text class="ts" x="30" y="62" text-anchor="start">출처: 수신기 라벨(사진 fs_ia6b_ports.jpg)과 2026-11-14 측정 · 03-electrical.md §3.5.4(R5·R6), §3.5.1(수신기 역할) · 04-firmware.md 핀 표(핀 15 = Serial3 RX)</text>
<rect class="panel" x="20" y="84" width="540" height="640" rx="10"/>
<text class="h2" x="40" y="114" text-anchor="start">① 수신기 끝면 — 라벨을 바로 읽는 방향 (B/VCC가 위)</text>
<rect class="face" x="50" y="140" width="480" height="460" rx="14"/>
<rect class="tag" x="70" y="168" width="96" height="26" rx="4"/>
<text class="tb" x="118" y="187" text-anchor="middle">B/VCC</text>
