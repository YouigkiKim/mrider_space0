<circle class="hL" cx="40" cy="1104" r="5"/><text class="t" x="54" y="1108">다음 단계에서 사용 — 지금은 연결 안 함</text>
<circle class="hD" cx="40" cy="1126" r="5"/><text class="t" x="54" y="1130">내장 LED (연결 없음, 루프마다 깜빡임)</text>
<circle class="hN" cx="40" cy="1148" r="5"/><text class="t" x="54" y="1152">사용 안 함</text>
<text class="t" x="30" y="1186">핀 2·3은 1500 µs, 21은 LOW로 펌웨어가 고정해 둔다.</text>
<text class="t" x="30" y="1208">왼쪽 아래 3.3V 핀과 오른쪽 가운데 GND 핀도 같은 전원이지만 이 배치에서는 쓰지 않는다.</text>
<text class="t" x="30" y="1274">C3·C4 100 nF는 래치 바로 옆, VCC–GND 사이 (데이터시트·§3.5.4). C1·C2 1 nF(신호)와 다른 역할.</text>
<text class="t" x="30" y="1252">DRV5013(TO-92): 인쇄면(사다리꼴의 좁은 쪽)을 보고 다리를 아래로 두면 왼쪽부터 1 VCC · 2 GND · 3 OUT.</text>
<text class="t" x="30" y="1230">브레드보드에서는 Teensy 양쪽의 전원 레일을 점퍼 2개로 이어 3.3 V·GND를 양쪽에 보낸다 (§3.5.3).</text>
<text class="tb" x="640" y="1066">기호와 확인 순서 (가이드 7.3)</text>
