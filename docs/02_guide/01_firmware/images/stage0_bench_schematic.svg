<text class="h1" x="30" y="40">Stage 0 테스트 벤치 회로도 — Teensy 4.1 실제 핀 배치 기준</text>
<text class="ts" x="30" y="63">Teensy를 윗면(부품면)에서 본 모습, USB가 위쪽. 핀 위치는 실제 보드와 같다. 센서만 연결 (모터·드라이버·RC·E-stop 없음).</text>
<text class="ts" x="30" y="81">원본: PJRC Teensy 4.1 핀 카드, docs/build/04-firmware.md 핀 표, docs/build/03-electrical.md §3.5.2–3.5.3</text>
