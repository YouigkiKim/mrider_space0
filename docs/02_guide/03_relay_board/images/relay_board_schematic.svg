<text class="red" x="978" y="288" text-anchor="start">거꾸로 = 배터리 단락</text>
<text class="blu" x="978" y="322" text-anchor="start">□ = K 단자</text>
<text class="ts" x="978" y="340" text-anchor="start">코일은 기판 밖 릴레이</text>
<line class="wdrn" x1="520" y1="470" x2="1000" y2="470"/>
<text class="tb" x="1006" y="474" text-anchor="start">DRAIN 버스</text>
