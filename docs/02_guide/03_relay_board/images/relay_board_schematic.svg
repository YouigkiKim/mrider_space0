<text class="tb" x="1006" y="704" text-anchor="start">GND 버스</text>
<rect class="term" x="294" y="694" width="12" height="12" rx="2"/>
<text class="tl" x="310" y="691" text-anchor="start">PWR GND</text>
<path class="wgnd" d="M300 700 L262 700 L262 722"/>
<text class="ts" x="30" y="748" text-anchor="start">→ 스타 접지(모터 드라이버). 이 기판에서 나가는 GND 선은 이것 하나</text>
<rect class="note" x="660" y="545" width="290" height="78" rx="6"/>
<text class="red" x="672" y="566" text-anchor="start">R1을 가장 먼저 납땜한다.</text>
<text class="ts" x="672" y="585" text-anchor="start">R2의 MOSFET 쪽(게이트 노드)에 붙는다.</text>
<text class="ts" x="672" y="602" text-anchor="start">게이트 선이 끊겨도 게이트가 GND로</text>
<text class="ts" x="672" y="619" text-anchor="start">묶여 코일이 꺼진다 → STOCK.</text>
<rect class="note" x="962" y="545" width="150" height="96" rx="6"/>
<text class="red" x="972" y="566" text-anchor="start">탭 = 드레인</text>
<text class="ts" x="972" y="585" text-anchor="start">접지된 금속판에</text>
<text class="ts" x="972" y="602" text-anchor="start">그냥 고정 금지.</text>
<text class="ts" x="972" y="619" text-anchor="start">방열판 불필요</text>
<text class="ts" x="972" y="636" text-anchor="start">(0.1 W 미만)</text>
<rect class="panel" x="24" y="775" width="590" height="196" rx="10"/>
<text class="h2" x="42" y="803" text-anchor="start">어떻게 동작하나</text>
<text class="t" x="42" y="827" text-anchor="start">· Teensy 핀 21 HIGH(3.3 V) → Q1 켜짐 → 코일 4개에 전류(약 600 mA)</text>
<text class="t" x="42" y="847" text-anchor="start">    → 접점이 87(NO)로 → 모터가 MDDS30에 연결 = DBW</text>
<text class="t" x="42" y="867" text-anchor="start">· 핀 21 LOW → Q1 꺼짐 → 접점이 87a(NC)로 → 순정 컨트롤러 = STOCK</text>
<text class="t" x="42" y="887" text-anchor="start">· 아래 경우는 모두 STOCK이 된다 (기본값이 안전한 쪽):</text>
<text class="t" x="42" y="907" text-anchor="start">    Teensy 꺼짐·리셋 / 게이트 선 빠짐(R1이 게이트를 GND로) /</text>
<text class="t" x="42" y="927" text-anchor="start">    로직 전원 끊김 / E-stop 누름(코일 전원 자체가 끊김)</text>
<text class="t" x="42" y="947" text-anchor="start">· 감지 노드: E-stop 풀림 ≈ 2.6–3.1 V, 눌림 = 0 V → Teensy 핀 20</text>
<rect class="panel" x="630" y="775" width="586" height="176" rx="10"/>
<text class="h2" x="648" y="803" text-anchor="start">E-stop 감지 전압 (R3 10 kΩ · R4 2.7 kΩ)</text>
<text class="t" x="648" y="827" text-anchor="start">배터리 전압     감지 노드 (× 0.213)</text>
<text class="t" x="648" y="847" text-anchor="start">· 12.0 V → 2.55 V</text>
<text class="t" x="648" y="867" text-anchor="start">· 12.8 V → 2.72 V (LiFePO₄ 공칭)</text>
<text class="t" x="648" y="887" text-anchor="start">· 13.3 V → 2.83 V (만충 휴지)</text>
<text class="t" x="648" y="907" text-anchor="start">· 14.6 V → 3.10 V (충전 중 최대)</text>
<text class="t" x="648" y="927" text-anchor="start">모두 3.3 V 아래 — 그래도 핀 20에 잇기 전에 잰다</text>
<rect class="panel" x="24" y="985" width="1192" height="136" rx="10"/>
<text class="h2" x="42" y="1013" text-anchor="start">릴레이가 바꾸는 선 (03-electrical.md §3.4) — 접점은 이 기판에 없다</text>
<text class="t" x="42" y="1037" text-anchor="start">· K1 조향 모터 A · K2 조향 모터 B · K3 구동 모터 A(병렬) · K4 구동 모터 B(병렬)</text>
<text class="t" x="42" y="1057" text-anchor="start">· 각 릴레이: 30 = 모터 쪽(공통) · 87a(NC) = 순정 컨트롤러(STOCK) · 87(NO) = MDDS30 출력(DBW) · 85·86 = 코일</text>
<text class="t" x="42" y="1077" text-anchor="start">· 코일 극성 약속: 86 → +12 V(E-stop 거친 전원), 85 → DRAIN. 12개 모두 같게 — 다이오드 하나만 거꾸로여도 배터리 단락</text>
<text class="t" x="42" y="1097" text-anchor="start">· 한 쌍(K1·K2, K3·K4)의 87a·87을 서로 바꿔 물리면 STOCK은 정상인데 DBW만 반대로 돈다 — 펌웨어 부호로 고치지 말고 선을 고친다</text>
</svg>